<div class="kpi-widget" *ngIf="!widgetData.loading && widgetData.data">
  <div class="kpi-value">{{ displayedValue | numberScroll:0:'¥' }}</div>
  <div class="kpi-label" *ngIf="widgetData.data.label">{{ widgetData.data.label }}</div>
  <div class="kpi-trend" *ngIf="widgetData.data.trend !== undefined" [ngClass]="getTrendClass(widgetData.data.trend)">
    <i nz-icon [nzType]="widgetData.data.trend >= 0 ? 'arrow-up' : 'arrow-down'"></i>
    {{ getAbsoluteTrend(widgetData.data.trend) }}%
  </div>
</div>

<div class="kpi-loading" *ngIf="widgetData.loading">
  <nz-skeleton [nzActive]="true" style="width: 100%;"></nz-skeleton>
</div>

<div class="kpi-error" *ngIf="widgetData.error">
  <div class="error-icon">
    <i nz-icon nzType="warning"></i>
  </div>
  <div class="error-text">数据加载失败</div>
  <button nz-button nzSize="small" (click)="retry()">重试</button>
</div>
